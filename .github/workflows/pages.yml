name: Deploy storage quote to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inject runtime connection
        env:
          STORAGE_QUOTE_ENDPOINT: ${{ secrets.STORAGE_QUOTE_ENDPOINT }}
        run: |
          test -n "$STORAGE_QUOTE_ENDPOINT"
          node -e "const fs=require('fs'); fs.mkdirSync('public',{recursive:true}); fs.writeFileSync('public/runtime-config.js', 'window.__STORAGE_QUOTE_CONFIG__ = ' + JSON.stringify({endpointUrl:process.env.STORAGE_QUOTE_ENDPOINT,tokenQueryKey:'token'}) + ';\n')"
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
